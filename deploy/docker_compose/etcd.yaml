services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: etcd
    ports:
      - "3379:2379"
      - "3380:2380"
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://192.168.1.5:3379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://192.168.1.5:3380
      - --initial-cluster=etcd=http://192.168.1.5:3380
      - --initial-cluster-state=new
    volumes:
      - ./components/etcd/data:/etcd-data
    restart: unless-stopped
    # healthcheck:
    #   # test: ["CMD", "sh", "-c", "curl -sf http://localhost:2379/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    networks:
      easy-chat:

