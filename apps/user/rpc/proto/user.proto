syntax = "proto3";

package user;
option go_package = "./user";

message User {
  string id       = 1;
  string nickname = 2;
  string avatar   = 3;
  string phone    = 4;
  int32  status   = 5;
  int32  sex      = 6;
}

message PingRequest {
  string ping = 1;
}

message PingResponse {
  string pong = 1;
}

message RegisterRequest {
  string nickname = 1;
  string avatar   = 2;
  string phone    = 3;
  string password = 4;
  int32  sex      = 5;
}

message RegisterResponse {
  string id = 1;
}

message LoginRequest {
  string phone    = 1;
  string password = 2;
}

message LoginResponse {
  string token      = 1;
  uint64 expired_at = 2;
}

message GetUserInfoRequest {
  string id = 1;
}

message GetUserInfoResponse {
  User user = 1;
}

message FindUserRequest {
  string          nickname = 1;
  string          phone    = 2;
  repeated string ids      = 3;
}

message FindUserResponse {
  repeated User users = 1;
}

// UserService is the service that implements the user RPC.
service UserService {
    // Ping is the RPC method that returns the pong.
    // @param PingRequest
    // @return PingResponse
  rpc Ping(PingRequest) returns (PingResponse);
  // Register is the RPC method that registers a user.
  // @param RegisterRequest
  // @return RegisterResponse
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login is the RPC method that logs a user in.
  // @param LoginRequest
  // @return LoginResponse
  rpc Login(LoginRequest) returns (LoginResponse);

  // GetUserInfo is the RPC method that returns the user info.
  // @param GetUserInfoRequest
  // @return GetUserInfoResponse
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);

  // FindUser is the RPC method that finds a user.
  // @param FindUserRequest
  // @return FindUserResponse
  rpc FindUser(FindUserRequest) returns (FindUserResponse);
}
